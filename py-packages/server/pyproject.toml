[project]
name = "corelle.server"
version = "1.2.0"
description = "An API server application for the Corelle plate-rotation system"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.10,<3.15"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Flask>=3.1,<4",
    "Flask-RESTful>=0.3.10,<0.4",
    "corelle.client>=2.2,<3",
    # A standalone install also loads models and features.
    "corelle.engine[import]>=3,<4",
    "numpy>=2.0.0,<3",
    "python-dotenv>=1.2.2,<2",
    "simplejson>=3.17.6,<5",
]

[tool.uv]

[tool.uv.sources]
"corelle.client" = { path = "../client", editable = true }
"corelle.engine" = { path = "../engine", editable = true }

[tool.uv.build-backend]
module-name = ["corelle"]
module-root = ""
namespace = true
wheel-exclude = ["corelle/server/test_api.py"]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
