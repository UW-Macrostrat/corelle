[project]
name = "corelle"
version = "1.0.3"
description = "An API service to support plate rotations on the web"
authors = [{ name = "Daven Quinn", email = "dev@davenquinn.com" }]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [
    "corelle.client",
    "corelle.engine[import,shell]",
    "corelle.server",
    "pytest>=8.3,<10",
    "black>=26,<27",
]

[tool.uv]
package = false
default-groups = "all"

[tool.uv.sources]
"corelle.client" = { path = "./py-packages/client", editable = true }
"corelle.engine" = { path = "./py-packages/engine", editable = true }
"corelle.server" = { path = "./py-packages/server", editable = true }

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
